; Keeps the rollup stream consumer running on Box A (work pack K-10, ADR-004a §3).
; Copy to /etc/supervisor/conf.d/ during the Box A setup (K-04/K-07), then:
;   supervisorctl reread && supervisorctl update
; A crash or restart is safe: unacknowledged messages are taken over after 5 minutes.

[program:navuuna-rollup-consumer]
command=php /srv/navuuna/apps/api/artisan engine:consume-batches
directory=/srv/navuuna/apps/api
user=navuuna
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
; Restart after every deploy so the worker reads the new code and weights.yml.
stdout_logfile=/var/log/navuuna/rollup-consumer.log
stderr_logfile=/var/log/navuuna/rollup-consumer.err.log
