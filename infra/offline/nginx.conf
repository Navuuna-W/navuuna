# nginx for the offline stack (work pack K-20): serves the built web app from apps/web/dist and
# passes API, session and tile requests to the Laravel API, so the browser sees one origin.
# Mounted into the web-offline service in infra/docker-compose.yml.

server {
    listen 80;
    root /usr/share/nginx/html;

    # The web app's own routes all load index.html; the app picks the screen.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The basemap is read in pieces with HTTP range requests, which nginx serves for static
    # files out of the box (Austine's apps/web/scripts/build-basemap.sh).
    location /basemap/ {
        try_files $uri =404;
    }

    location ~ ^/(api|sanctum|tiles)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
