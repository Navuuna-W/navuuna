# Python project for the signal service (Bible §14.1, §14.5).
# `engine/` is the module-agnostic runner and rollup (Core lane); `modules/` holds the
# per-module adapters (Signal lane). Lint, type and test settings for both live here.

[project]
name = "navuuna-signals"
version = "0.1.0"
description = "Navuuna signal service: adapters, runner and rollup"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "redis>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",  # 9.0.3 fixes PYSEC-2026-1845 (K-19 audit)
    "pytest-cov>=5.0,<7",
    "mypy>=1.13,<2",
    "ruff>=0.7,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors · I: import order · N: naming · B: likely bugs · UP: modern syntax
select = ["E", "F", "I", "N", "B", "UP"]
