# Sub-variable weights for the rollup — the engine's own weights, not a lens's.
# Read by the signal-service rollup after adapters write sub-variable scores; every
# scores.variable_scores row stores the weight_version that produced it (Bible §6.7, NFR-08).
# Changing any number here needs an ADR (ADR-007). Gates (1.1, 2.1) and the guard (2.6)
# carry no weight on purpose: gates veto, contributors average (Bible §6.3).
# Each variable's weights sum to 1.00.

weight_version: 1

V1_activity:            # 1.1 Presence is a GATE (no weight)
  "1.2": 0.40           # Operational state
  "1.3": 0.25           # Utilisation ratio
  "1.4": 0.25           # Continuity
  "1.5": 0.10           # Intensity

V2_discrepancy:         # 2.1 Existence gap is a GATE, 2.6 Explanation state a GUARD (no weight)
  "2.2": 0.35           # Magnitude gap
  "2.4": 0.35           # Status gap
  "2.3": 0.15           # Attribute gap
  "2.5": 0.15           # Record staleness

V3_momentum:
  "3.5": 0.30           # Neighbourhood momentum — leads 3.1 in almost every case (Bible §6.9)
  "3.1": 0.20           # Direction
  "3.2": 0.15           # Rate
  "3.6": 0.15           # Headroom
  "3.3": 0.10           # Consistency
  "3.4": 0.10           # Acceleration

V4_resource_security:
  "4.1": 0.25           # Availability
  "4.2": 0.25           # Reliability
  "4.3": 0.15           # Trend
  "4.5": 0.15           # Hazard exposure
  "4.4": 0.10           # Competition
  "4.6": 0.10           # Buffer

V5_accessibility:
  "5.3": 0.25           # Access reliability   — with 5.5, our differentiators:
  "5.5": 0.20           # Service availability — competitors compute 5.1 once and stop
  "5.1": 0.20           # Proximity
  "5.2": 0.15           # Connection quality
  "5.4": 0.10           # Cost of access
  "5.6": 0.10           # Redundancy
