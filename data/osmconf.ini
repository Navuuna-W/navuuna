# Tells ogr2ogr how to read the OpenStreetMap extract (used by extract_base_layers.sh).
# Each tag listed under `attributes` becomes a property of the layer's features; the loaders in
# services/ingest/base_layers/ read exactly these. Every other tag is dropped.

# Closed ways with one of these tags are areas, not lines. `man_made` is added to GDAL's own
# list so that a water works or a tank drawn as an outline is kept as an outline.
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform,man_made
attribute_name_laundering=yes

[points]
osm_id=yes
attributes=name,amenity,man_made,content,operator,access
other_tags=no

[lines]
osm_id=yes
attributes=name,highway,surface
other_tags=no

[multipolygons]
osm_id=yes
osm_way_id=yes
attributes=name,amenity,man_made,content,operator,access,building
other_tags=no

[multilinestrings]
osm_id=yes
other_tags=no

[other_relations]
osm_id=yes
other_tags=no
