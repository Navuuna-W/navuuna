# CI for every pull request to main (Bible K1.2, §14.7). One job per area of the repo:
# commitlint, web, python, php, migration-lint, modularity, secret-scan and dependency-audit.
# Jobs whose code has not landed yet (php before apps/api exists) skip their steps
# and pass, then switch on by themselves when the code arrives.

name: ci

on:
  pull_request:
    branches: [main]
    # `edited` covers a stacked PR moved onto main after its base merged: without it, that
    # PR merges having never run CI (#22). It also re-checks a PR title after it is fixed.
    types: [opened, synchronize, reopened, edited]

# A new run on the same PR (a push, or editing the description) cancels the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint needs the full branch history

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19

      - name: Lint every commit on the branch
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      # The PR title becomes the squash commit on main, so it must follow the same format.
      # Passed through an env var, never inlined, so a title cannot inject shell commands.
      - name: Lint the PR title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          COMMITLINT_SKIP_REFS: "true"
        run: printf '%s\n' "$PULL_REQUEST_TITLE" | npx commitlint --verbose

  # The web job type-checks, lints, tests and builds apps/web on every PR.
  # Owner: Austine (A-03). Only runs when apps/web files change on the PR.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      # Regenerate the OpenAPI client types from the committed draft and fail if the
      # committed copy drifts (A-06 / NFR-02). schema.d.ts is marked
      # linguist-generated=true in .gitattributes; it must still be committed because
      # typecheck depends on it.
      - name: Check generated API types are fresh
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The python job lints, type-checks and tests the signal service (engine + modules).
  # Engine coverage must stay at 100 % (Bible §14.7). Database tests need the real schema,
  # and Laravel owns every migration (ADR-004a), so this job runs `artisan migrate` first.
  # Stream tests need a Redis.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signals
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: navuuna_test
          POSTGRES_USER: navuuna
          POSTGRES_PASSWORD: navuuna # throwaway CI database, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navuuna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Stream tests (signals.batch_written, ADR-004a §3) need a real Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: navuuna_test
      DB_USERNAME: navuuna
      DB_PASSWORD: navuuna
      NV_TEST_DATABASE_URL: postgresql://navuuna:navuuna@127.0.0.1:5432/navuuna_test
      NV_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3" # ADR-009
          extensions: pdo_pgsql
          coverage: none

      - name: Build the database schema with the Laravel migrations
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan migrate --force --no-interaction

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/signals/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (engine)
        run: mypy --strict engine

      # modules/ is Devyan's folder; it is type-checked as soon as it holds any code.
      - name: Mypy (modules)
        if: hashFiles('services/signals/modules/**/*.py') != ''
        run: mypy --strict modules

      - name: Pytest with 100 % engine coverage
        run: pytest --cov=engine --cov-fail-under=100

  # The flows job lints, type-checks and tests the Prefect flows (K-12, ADR-014). The tests
  # start a throwaway Prefect server, so no services are needed.
  flows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/flows/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy --strict .

      - name: Pytest
        run: pytest

  # The php job runs Pint, PHPStan (level set in apps/api/phpstan.neon) and Pest against
  # a real PostGIS database. Every step waits for apps/api/composer.json, which K-06a adds.
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: navuuna_test
          POSTGRES_USER: navuuna
          POSTGRES_PASSWORD: navuuna # throwaway CI database, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navuuna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The rollup stream consumer tests (K-10, ADR-004a §3) need a real Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: navuuna_test
      DB_USERNAME: navuuna
      DB_PASSWORD: navuuna
    steps:
      - uses: actions/checkout@v4

      - name: Note when the Laravel app is not there yet
        if: hashFiles('apps/api/composer.json') == ''
        working-directory: .
        run: echo "::notice::apps/api does not exist yet; php steps skipped."

      - uses: shivammathur/setup-php@v2
        if: hashFiles('apps/api/composer.json') != ''
        with:
          php-version: "8.3" # ADR-009
          extensions: pdo_pgsql
          # pcov records which lines the tests run, for the app/Engine coverage gate below.
          coverage: pcov

      - name: Install
        if: hashFiles('apps/api/composer.json') != ''
        run: composer install --no-interaction --no-progress --prefer-dist

      # Laravel reads .env on boot; without one, every test logs a file-not-found warning.
      # The DB_* values above and phpunit.xml still win over what .env.example says.
      - name: Create .env from the example
        if: hashFiles('apps/api/composer.json') != ''
        run: cp .env.example .env

      - name: Pint
        if: hashFiles('apps/api/composer.json') != ''
        run: ./vendor/bin/pint --test

      - name: PHPStan
        if: hashFiles('apps/api/composer.json') != ''
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Pest
        if: hashFiles('apps/api/composer.json') != ''
        run: ./vendor/bin/pest --coverage-clover=coverage.xml

      # Work pack K-10: every line of the rollup engine is run by a test.
      - name: app/Engine coverage is 100 %
        if: hashFiles('apps/api/app/Engine/**') != ''
        run: php tests/check_engine_coverage.php coverage.xml

  # The migration-lint job enforces two rules no PHP linter covers (CLAUDE.md §4):
  # every migration has a real down(), and every Schema::create names a schema.
  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the linter itself
        run: |
          pip install 'pytest>=8.3,<9'
          pytest .github/scripts/tests

      - name: Lint migrations
        run: python .github/scripts/lint_migrations.py

  # The modularity job proves a module can be deleted and the build still passes
  # (NFR-07, Bible §14.7). roads is the module the Bible names for this test.
  modularity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signals
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/signals/pyproject.toml

      - name: Delete the roads module
        run: rm -rf modules/roads

      - name: Install
        run: pip install -e '.[dev]'

      - name: Tests pass without roads
        run: pytest

  # The secret-scan job runs gitleaks over the commits in this PR. It uses the release
  # binary, not gitleaks-action, because the action needs a paid licence for org repos.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads every commit on the branch

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Scan the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose

  # Known security advisories in our dependencies (NFR-05, work pack K-19). Composer and
  # Python fail the build. npm checks only what ships to the browser (--omit=dev) and only
  # reports for now: maplibre-gl has a critical advisory that Austine is upgrading (#90).
  # Remove continue-on-error once #90 is merged.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3" # ADR-009
          coverage: none

      - name: Composer audit
        working-directory: apps/api
        run: composer audit --locked --no-interaction

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Audits the packages the signal service installs, dev tools included. Our own package
      # is skipped: it is not on PyPI, so there is nothing to look up.
      - name: Python audit
        working-directory: services/signals
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' pip-audit
          pip-audit --skip-editable --progress-spinner off

      - name: Python audit (flows)
        working-directory: services/flows
        run: |
          pip install -e '.[dev]'
          pip-audit --skip-editable --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit (runtime packages, report only until #90)
        working-directory: apps/web
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
