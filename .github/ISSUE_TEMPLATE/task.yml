# One issue per work-pack task row (Bible §14.10). The PR that finishes it says `Closes #n`.
name: Task
description: A work-pack task, e.g. K-09a
title: "K-00 — FR-00 short description"
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: From the work pack, e.g. K-09a, D-04, A-07
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: FR / ADR it serves
      placeholder: FR-09, ADR-004
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Copy the Done check from the work pack.
    validations:
      required: true
  - type: textarea
    id: needs
    attributes:
      label: Needs
      description: What must exist first, and the stub used until it does.
  - type: markdown
    attributes:
      value: "Add labels: `module:*`, `layer:*`, `pri:*`, `owner:*`."
